# 이 파일을 복사해 서버의 /var/clubapp/config.properties 로 만들고 값을 채운다.
# config.properties 는 .gitignore 에 있어 커밋되지 않는다.

db.url=jdbc:mysql://localhost:3306/clubapp?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
db.user=clubapp
db.password=

upload.dir=/var/clubapp/uploads

naver.client.id=
naver.client.secret=
naver.callback.url=http://<탄력적 IP>:8080/login/naver/callback

# 카카오 디벨로퍼스 > 앱 키 > REST API 키 (클라이언트 시크릿 사용), 리다이렉트 URI 와 같은 주소
kakao.client.id=
kakao.client.secret=
kakao.callback.url=http://<탄력적 IP>:8080/login/kakao/callback

# 네이버 클라우드 플랫폼 > Application 의 Client ID / Client Secret (서비스 URL 에 http://<탄력적 IP>:8080 등록)
# 지도 표시 (Dynamic Map, 브라우저에 노출되는 값)
naver.map.client.id=
# 장소 검색 (NAVER API HUB). 비워 두면 naver.client.id/secret 로 네이버 검색 API 를 호출한다
naver.hub.client.id=
naver.hub.client.secret=

ga.measurement.id=

# Google AI Studio 에서 발급한 Gemini API 키 (무료 등급: 결제 연결 안 함)
ai.api.key=
# 비워 두면 gemini-3.5-flash-lite. 무료로 쓸 수 있는 모델은 AI Studio 의 사용량 · 한도 화면에서 확인
ai.model=
